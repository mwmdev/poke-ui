<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Paste</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #16161b;
      font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace;
    }
    .window {
      display: flex;
      flex-direction: column;
      width: 1100px;
      height: 680px;
      overflow: hidden;
      background: #1c1c1f;
      border: 1px solid #2c2c33;
      border-radius: 12px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
    }
    .bar { display: flex; gap: 8px; padding: 16px 18px; }
    .bar i { width: 12px; height: 12px; border-radius: 50%; background: #55555e; }
    .body { flex: 1; min-height: 0; padding: 4px 28px 0; overflow: hidden; }
    .prompt { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; font-size: 15px; color: #e7e7ee; }
    .prompt b { color: #e5484d; font-weight: 700; }
    .chip { padding: 2px 10px; border-radius: 6px; background: #34343c; color: #a8a8b5; }
    pre { margin: 0; font: inherit; font-size: 15px; line-height: 1.55; color: #e7e7ee; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <div class="window">
    <div class="bar"><i></i><i></i><i></i></div>
    <div class="body">
      <div class="prompt"><b>&gt;</b><span class="chip" id="chip">[Pasted text]</span></div>
      <pre id="out"></pre>
    </div>
  </div>
</body>
</html>
