<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Promo tile</title>
  <style>
    html, body { width: 440px; height: 280px; margin: 0; overflow: hidden; }
    body {
      position: relative;
      background: linear-gradient(135deg, #34343c, #16161b);
      font-family: system-ui, sans-serif;
    }
    img { position: absolute; left: 145px; top: 65px; width: 150px; height: 150px; }
    .pin {
      position: absolute;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.35);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <img src="/logo.svg" alt="">
  <div class="pin" style="left: 57px; top: 57px; background: #e5484d">1</div>
  <div class="pin" style="left: 347px; top: 77px; background: #0090ff">2</div>
  <div class="pin" style="left: 317px; top: 202px; background: #30a46c">3</div>
</body>
</html>
