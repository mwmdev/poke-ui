<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Promo tile</title>
  <style>
    html, body { width: 440px; height: 280px; margin: 0; overflow: hidden; background: #f4ecdc; }
    svg { display: block; }
  </style>
</head>
<body>
<!-- The Web Store small promo tile, 440x280. Paper on the left: the wordmark and a button being poked (highlight and
     pin, as in the extension). Ink on the right: the markdown that the note becomes. -->
<svg width="440" height="280" viewBox="0 0 440 280" xmlns="http://www.w3.org/2000/svg">
  <rect width="440" height="280" fill="#f4ecdc"/>
  <rect x="262" y="0" width="178" height="280" fill="#1f1b17"/>

  <text x="32" y="70" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, 'TeX Gyre Pagella', 'URW Palladio L', 'Book Antiqua', Georgia, serif"
    font-weight="700" font-size="46" letter-spacing="-0.9" fill="#2a241e">Poke UI</text>

  <!-- The element, its highlight, and the pin whose sharp corner points into it. -->
  <rect x="84" y="172" width="136" height="44" rx="22" fill="#1f4d3a"/>
  <text x="152" y="199" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif"
    font-size="15" font-weight="600" fill="#fff">Start growing</text>
  <rect x="78" y="166" width="148" height="56" rx="3" fill="#b4432a" fill-opacity=".08" stroke="#b4432a" stroke-width="2.5"/>
  <!-- tagPath(44, 130, 40, 3): tip at (84, 170) -->
  <path d="M64 130H64A20 20 0 0 1 84 150V167Q84 170 81 170H64A20 20 0 0 1 44 150A20 20 0 0 1 64 130Z"
    fill="#b4432a" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
  <text x="64" y="157" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif"
    font-size="20" font-weight="700" fill="#fff">1</text>

  <!-- The pasted markdown. -->
  <g font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', 'Segoe UI Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12">
    <text x="284" y="46" fill="#e9b95c" font-weight="700">### Annotation 1</text>
    <text x="284" y="72" fill="#efe6d6">Make this the</text>
    <text x="284" y="90" fill="#efe6d6">primary button</text>
    <text x="284" y="116" fill="#9fb08a">- Selector:</text>
    <text x="284" y="134" fill="#b0a493">`button.cta`</text>
    <text x="284" y="160" fill="#9fb08a">- Box:</text>
    <text x="284" y="178" fill="#b0a493">x=517 y=585</text>
  </g>
  <rect x="284" y="200" width="118" height="6" rx="1" fill="#3a332b"/>
  <rect x="284" y="214" width="92" height="6" rx="1" fill="#3a332b"/>
  <rect x="284" y="228" width="104" height="6" rx="1" fill="#3a332b"/>
</svg>
</body>
</html>
